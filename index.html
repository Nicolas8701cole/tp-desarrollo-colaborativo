<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ideas Último Año</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <h2>Ideas Último Año</h2>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Propuestas</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Propuestas para el último año</h1>
            <p>Votá ideas para hacer este último año inolvidable.</p>
            <button id="votar">Apoyar esta idea</button>
            <p id="contador">Votos: 0</p>
        </section>


        <section class="propuesta">
            <h2>Enviar una propuesta</h2>
            <form id="formPropuesta">
                <label for="nombre">Tu nombre</label>
                <input type="text" id="nombre" name="nombre">
                <label for="idea">Tu propuesta</label>
                <input type="text" id="idea" name="idea">
                <button>Enviar propuesta</button>
                <p id="mensaje"></p>
            </form>
        </section>

        <section class="votacion">
            <h2>Votar para poder jugar en las pc del labo</h2>
            <form id="formvotacion">
                <label for="nombreVotante">Tu nombre</label>
                <input type="text" id="nombreVotante" name="nombreVotante">

                <button>Enviar propuesta</button>
                <p id="votos"></p>
            </form>
        </section>

    </main>

    <!--commit2-->
    <footer>
        <p>Promoción 2026</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
